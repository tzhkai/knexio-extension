<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360">
<title>Knexio 阅读伴侣</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="tabs">
  <button class="tab active" data-tab="translate">📝 翻译</button>
  <button class="tab" data-tab="summarize">🤖 摘要</button>
  <button class="tab" data-tab="save">💾 保存</button>
</div>

<div class="panel active" id="panel-translate">
  <select id="translate-to" class="lang-select">
    <option value="zh-CN">翻译成 中文</option>
    <option value="en">翻译成 English</option>
    <option value="ja">翻译成 日本語</option>
    <option value="ko">翻译成 한국어</option>
    <option value="fr">翻译成 Français</option>
    <option value="de">翻译成 Deutsch</option>
    <option value="es">翻译成 Español</option>
    <option value="ru">翻译成 Русский</option>
  </select>
  <textarea id="translate-input" placeholder="输入文字，或选中网页文字后点右键翻译..."></textarea>
  <button id="translate-btn" class="primary-btn">翻译</button>
  <div id="translate-result" class="result-box"></div>
  <div class="result-actions" id="translate-actions" style="display:none">
    <button class="copy-btn" data-target="translate-result">复制结果</button>
  </div>
</div>

<div class="panel" id="panel-summarize">
  <div id="summarize-status" class="status-line">
    <span class="status-icon">🟡</span> 智能摘句就绪
  </div>
  <p class="hint">右键页面任意位置 →「✂️ 智能摘句」或点击下方按钮。<a href="options.html" target="_blank" style="color:#4f8ff7">配置 DeepSeek</a> 后解锁 AI 语义级总结。</p>
  <button id="summarize-btn" class="primary-btn">智能摘句</button>
  <button id="ai-summarize-btn" class="primary-btn" style="display:none;margin-top:6px;background:#7c3aed;">✨ AI 深度总结</button>
  <div id="summarize-result" class="result-box"></div>
  <div class="result-actions" id="summarize-actions" style="display:none">
    <button class="copy-btn" data-target="summarize-result">复制结果</button>
  </div>
</div>

<div class="panel" id="panel-save">
  <p class="hint">快速保存当前页面到 Knexio 书签，需要先在 Knexio 登录。</p>
  <div class="save-info">
    <div class="info-row"><span class="label">标题</span><span id="save-title">-</span></div>
    <div class="info-row"><span class="label">链接</span><span id="save-url">-</span></div>
  </div>
  <button id="save-btn" class="primary-btn">保存到 Knexio</button>
  <div id="save-result" class="result-box"></div>
</div>

<div class="footer">
  <a href="options.html" target="_blank">⚙️ 设置</a>
  <span class="sep">|</span>
  <a href="https://knexio.xyz" target="_blank">knexio.xyz</a>
  <span class="sep">|</span>
  <span class="version">v1.0.0</span>
</div>

<script src="popup.js"></script>
</body>
</html>
