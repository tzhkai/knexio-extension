<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title data-i18n="app_name">Knexio 阅读伴侣</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --knexio-primary: #4f8ff7;
  --knexio-primary-dark: #3a7be8;
  --knexio-dark: #12121f;
  --knexio-darker: #0d0d18;
  --knexio-border: #2a2a3e;
  --knexio-text: #e0e0e0;
  --knexio-text-dim: #888;
  --knexio-bg: #1a1a2e;
}
html, body { height: 100%; overflow: hidden; }
body {
  width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--knexio-bg);
  color: var(--knexio-text);
  display: flex;
  flex-direction: column;
  font-size: 13px;
}

/* ── Tab navigation ── */
.tabs {
  display: flex;
  background: var(--knexio-dark);
  border-bottom: 1px solid var(--knexio-border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 10px 6px;
  background: none;
  border: none;
  color: var(--knexio-text-dim);
  font-size: 12px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab-btn:hover { color: #ccc; }
.tab-btn.active {
  color: #fff;
  border-bottom-color: var(--knexio-primary);
}

/* ── Panel content area ── */
.panel-container {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.panel {
  display: none;
  padding: 14px;
  overflow-y: auto;
  flex: 1;
}
.panel.active { display: block; }

/* ── Translate ── */
.lang-select {
  width: 100%;
  padding: 7px 10px;
  margin-bottom: 10px;
  background: var(--knexio-dark);
  color: var(--knexio-text);
  border: 1px solid var(--knexio-border);
  border-radius: 6px;
  font-size: 12px;
  outline: none;
}
textarea {
  width: 100%;
  height: 80px;
  padding: 10px;
  background: var(--knexio-dark);
  color: var(--knexio-text);
  border: 1px solid var(--knexio-border);
  border-radius: 6px;
  font-size: 13px;
  resize: vertical;
  outline: none;
  font-family: inherit;
}
textarea:focus { border-color: var(--knexio-primary); }

.primary-btn {
  width: 100%;
  padding: 9px;
  margin-top: 8px;
  background: var(--knexio-primary);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.15s;
}
.primary-btn:hover { background: var(--knexio-primary-dark); }
.primary-btn:disabled { background: #2a2a5e; color: #666; cursor: not-allowed; }

.result-box {
  margin-top: 10px;
  padding: 10px;
  background: var(--knexio-dark);
  border: 1px solid var(--knexio-border);
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.6;
  min-height: 20px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow-y: auto;
}
.result-box:empty { display: none; }

.result-actions { margin-top: 8px; }
.copy-btn {
  padding: 4px 12px;
  background: #2a2a3e;
  color: #aaa;
  border: none;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
}
.copy-btn:hover { background: #3a3a5e; }

.promo-bar {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--knexio-border);
  text-align: center;
  font-size: 11px;
  color: #64748b;
}
.promo-bar a { color: var(--knexio-primary); text-decoration: none; }
.promo-bar a:hover { text-decoration: underline; }

/* ── Summarize ── */
.status-line {
  padding: 8px 10px;
  background: var(--knexio-dark);
  border-radius: 6px;
  font-size: 12px;
  margin-bottom: 10px;
}
.status-icon { margin-right: 6px; }

.hint {
  font-size: 11px;
  color: var(--knexio-text-dim);
  margin-bottom: 8px;
  line-height: 1.5;
}
.hint a { color: var(--knexio-primary); }

/* ── Markdown ── */
.save-info {
  margin: 10px 0;
  background: var(--knexio-dark);
  border-radius: 6px;
  padding: 10px;
}
.info-row {
  display: flex;
  gap: 8px;
  font-size: 12px;
  margin-bottom: 4px;
}
.info-row .label { color: var(--knexio-text-dim); min-width: 30px; }
.info-row span:last-child { color: #ccc; word-break: break-all; }

/* ── Brand footer ── */
.brand-footer {
  flex-shrink: 0;
  background: var(--knexio-darker);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
  font-size: 12px;
  border-top: 1px solid var(--knexio-border);
}
.brand-text { color: #a5b4fc; }
.brand-logo {
  font-weight: 700;
  font-size: 14px;
  color: var(--knexio-primary);
  letter-spacing: 1px;
}
.brand-link {
  color: #06b6d4;
  text-decoration: none;
  font-weight: 500;
}
.brand-link:hover { color: #22d3ee; text-decoration: underline; }
.brand-links {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-left: 12px;
  padding-left: 12px;
  border-left: 1px solid #3730a3;
}
.brand-links a {
  color: #a5b4fc;
  text-decoration: none;
  font-size: 11px;
}
.brand-links a:hover { color: #fff; }
.brand-links span { color: #4f46e5; }
</style>
</head>
<body>

<!-- Tab navigation -->
<div class="tabs">
  <button class="tab-btn active" data-tab="translate" data-i18n="translate">📝 翻译</button>
  <button class="tab-btn" data-tab="summarize" data-i18n="summarize">🤖 摘要</button>
  <button class="tab-btn" data-tab="md" data-i18n="md_tab">📝 转 MD</button>
</div>

<!-- Panel container -->
<div class="panel-container">

  <!-- Translate panel -->
  <div class="panel active" id="panel-translate">
    <select id="translate-to" class="lang-select">
      <option value="zh-CN" data-i18n="translate_to_zh">翻译成 中文</option>
      <option value="en" data-i18n="translate_to_en">翻译成 English</option>
      <option value="ja" data-i18n="translate_to_ja">翻译成 日本語</option>
      <option value="ko" data-i18n="translate_to_ko">翻译成 한국어</option>
      <option value="fr" data-i18n="translate_to_fr">翻译成 Français</option>
      <option value="de" data-i18n="translate_to_de">翻译成 Deutsch</option>
      <option value="es" data-i18n="translate_to_es">翻译成 Español</option>
      <option value="ru" data-i18n="translate_to_ru">翻译成 Русский</option>
    </select>
    <textarea id="translate-input" data-i18n-placeholder="translate_input_hint" placeholder="输入文字，或选中网页文字后点右键翻译..."></textarea>
    <button id="translate-btn" class="primary-btn" data-i18n="translate_btn">翻译</button>
    <div id="translate-result" class="result-box"></div>
    <div class="result-actions" id="translate-actions" style="display:none">
      <button class="copy-btn" data-target="translate-result" data-i18n="copy_result">复制结果</button>
    </div>
    <div class="promo-bar" id="translate-promo" style="display:none">
      <span>🛠 <a href="https://knexio.xyz" target="_blank">knexio.xyz</a> · 100+ 免费在线工具</span>
    </div>
  </div>

  <!-- Summarize panel -->
  <div class="panel" id="panel-summarize">
    <div id="summarize-status" class="status-line">
      <span class="status-icon">🟡</span> <span data-i18n="summarize_ready">智能摘句就绪</span>
    </div>
    <p class="hint"><span data-i18n="summarize_hint">右键页面任意位置 →「✂️ 智能摘句」或点击下方按钮。</span><a href="options.html" target="_blank" style="color:#4f8ff7"> DeepSeek</a></p>
    <button id="summarize-btn" class="primary-btn" data-i18n="summarize_btn">智能摘句</button>
    <button id="ai-summarize-btn" class="primary-btn" style="display:none;margin-top:6px;background:#7c3aed;" data-i18n="ai_summarize_btn">✨ AI 深度总结</button>
    <div id="summarize-result" class="result-box"></div>
    <div class="result-actions" id="summarize-actions" style="display:none">
      <button class="copy-btn" data-target="summarize-result" data-i18n="copy">复制</button>
      <button id="summarize-translate-btn" class="copy-btn" style="color:#e67e22" data-i18n="summarize_translate_btn">🌐 翻译</button>
      <button id="summarize-original-btn" class="copy-btn" style="display:none;color:#3498db" data-i18n="summarize_original_btn">查看原文</button>
    </div>
    <div class="promo-bar" id="summarize-promo" style="display:none">
      <span>🛠 <a href="https://knexio.xyz" target="_blank">knexio.xyz</a> · 100+ 免费在线工具</span>
    </div>
  </div>

  <!-- Markdown panel -->
  <div class="panel" id="panel-md">
    <p class="hint" id="md-hint" data-i18n="md_hint">提取正文为 Markdown，免费在线编辑器打开 ✨</p>
    <div class="save-info">
      <div class="info-row"><span class="label" data-i18n="save_title_label">标题</span><span id="md-title">-</span></div>
      <div class="info-row"><span class="label" data-i18n="save_url_label">链接</span><span id="md-url">-</span></div>
    </div>
    <button id="md-btn" class="primary-btn" data-i18n="md_btn">打开编辑器</button>
    <div id="md-result" class="result-box"></div>
  </div>

</div>

<!-- Brand footer (promo) -->
<div class="brand-footer">
  <span class="brand-logo">KNEXIO</span>
  <span class="brand-text"> · </span>
  <span style="background:#10b981;color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600;" data-i18n="brandFree">100+ 免费工具</span>
  <a href="https://knexio.xyz" target="_blank" class="brand-link" data-i18n="brandOfficial">访问官网</a>
  <div class="brand-links">
    <a href="https://knexio.xyz/tools" target="_blank" data-i18n="brandTools">在线工具</a>
    <span>·</span>
    <a href="https://knexio.xyz/finance" target="_blank" data-i18n="brandFinance">财务工具</a>
    <span>·</span>
    <a href="https://knexio.xyz/games" target="_blank" data-i18n="brandGames">网页游戏</a>
  </div>
</div>

<script src="i18n.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
